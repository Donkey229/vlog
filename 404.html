<!-- GitHub Pages visar den här sidan för alla okända adresser, även djupa som /vlog/minne/123, där relativa css/, js/ och index.html
     pekar fel. Skriptet sätter <base> till sajtens rot innan något laddas: första mappen på *.github.io (projektsida), annars /
     (egen domän). Ändras skriptet måste hashen i CSP:n ovan räknas om – testet i tests/fix_start.test.js skriver ut den nya. -->
<script>(function(){var s=location.pathname.split('/')[1],b=document.createElement('base');b.href=/\.github\.io$/.test(location.hostname)&&s?'/'+s+'/':'/';document.head.appendChild(b)})()</script>
